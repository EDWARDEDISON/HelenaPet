<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>听见你 · 海伦娜桌宠</title><link rel="stylesheet" href="style.css"></head><body><main id="pet"><canvas id="canvas" width="880" height="1300" aria-label="海伦娜桌宠"></canvas><div id="bubble" hidden><span id="bubble-kind"></span><p id="bubble-text"></p></div><div id="charge" hidden></div></main><main id="panel" hidden><header><span class="eyebrow">HELENA / A LITTLE ECHO</span><h1>听见你</h1><p>留一点时间，给安静的陪伴。</p><span class="beta">Mac 测试版</span></header><section><h2>聊天与心情</h2><div class="row" id="talk-buttons"></div><div class="moods" id="moods"></div></section><section><h2>一起做点什么</h2><div class="row" id="actions"></div><label>甜品<select id="food"><option value="0">胶牙饧</option><option value="1">曲奇</option><option value="2">小蛋糕</option><option value="3">酥皮奶油浓汤</option></select></label><div class="row"><button id="page">再翻一页 / 再喂一口</button><button id="stop">收起道具</button><button id="hop">回声小跳</button></div></section><section><h2>衣橱与搭配</h2><label>今天穿什么<select id="skin"></select></label><label>帽顶小装饰<select id="decoration"></select></label><label>装饰大小<input id="decorationSize" type="range" min="0.7" max="2" step="0.1"></label><label>环绕小挂件<select id="pendant"></select></label><label>挂件大小<input id="pendantSize" type="range" min="0.7" max="2.2" step="0.1"></label></section><section><h2>视线与大小</h2><label>看向哪里<select id="gaze"></select></label><label>桌宠大小<input id="scale" type="range" min="0.42" max="1.25" step="0.01"></label><label>文字大小<input id="textSize" type="range" min="16" max="28" step="1"></label><label class="check"><input id="topmost" type="checkbox">始终在上层</label><label class="check"><input id="auto" type="checkbox">闲置后小憩，过一阵再醒来</label><label class="check"><input id="dailyHop" type="checkbox">偶尔跳一下</label><label class="check"><input id="typewriter" type="checkbox">文字慢慢出现</label></section><section><h2>怎么和她互动</h2><p class="help">轻点部位聊天，长按摸摸头；按住左键移动可以搬家。鼠标滚轮或触控板双指滑动调整大小。右键轻点打开面板，右键按住蓄力，松开后跳 1–3 次。Mac 触控板可用双指轻点进行右键操作；蓄力更适合实体鼠标。</p><p class="help">菜单栏的小头像里可以找回桌宠和退出。无需麦克风、摄像头、辅助功能或屏幕录制权限。</p></section><footer><button id="recover">找回桌宠</button><button id="quit">退出</button><p>本地预置台词 · 不接入 AI<br>个人同人作品，非游戏官方应用。</p></footer></main><script type="module" src="renderer.mjs"></script></body></html>
